<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영단어">
<title>영단어</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c47a2a">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#f7f3ed;color:#2c2418;font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;min-height:100vh;max-width:480px;margin:0 auto}
.main-tabs{display:flex;background:#fff;border-bottom:2px solid #ede8e0;position:sticky;top:0;z-index:10}
.main-tab{flex:1;padding:14px 0;border:none;background:transparent;color:#a0927c;font-size:14px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s}
.main-tab.on{color:#2c2418;border-bottom-color:#c47a2a}
.page{display:none;padding:16px 14px 70px}
.page.active{display:block}
.word-header{text-align:center;padding:12px 0 16px}
.word-header h2{font-size:18px;font-weight:900}
.word-header p{font-size:12px;color:#a0927c;margin-top:3px}
.kid-tabs{display:flex;gap:8px;background:#ede8e0;border-radius:14px;padding:5px;margin-bottom:14px}
.kid-tab{flex:1;padding:9px 0;border-radius:10px;border:none;background:transparent;color:#7a6a58;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s}
.kid-tab.on1{background:#c47a2a;color:#fff}
.kid-tab.on2{background:#2a7a9e;color:#fff}
.word-card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid rgba(0,0,0,0.07);margin-bottom:12px}
.word-card-header{padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.word-card-title{font-size:12px;color:#a0927c;font-weight:700}
.word-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;color:#fff}
.word-section-label{font-size:10px;font-weight:700;letter-spacing:1.5px;color:#a0927c;padding:10px 16px 6px;background:#faf8f5}
.word-row{display:flex;align-items:center;padding:8px 16px;gap:10px;border-top:1px solid rgba(0,0,0,0.04)}
.word-num{font-size:11px;color:#c0b09a;width:18px;text-align:right;flex-shrink:0}
.word-en{font-size:14px;font-weight:700;width:90px;flex-shrink:0}
.word-pron{font-size:12px;color:#a0927c;width:62px;flex-shrink:0}
.word-kr{font-size:13px;font-weight:700;flex:1}
.word-en{cursor:pointer;text-decoration:underline;text-decoration-color:rgba(0,0,0,0.15);text-underline-offset:3px}
.word-en:active{opacity:0.6}
.spk{background:transparent;border:none;font-size:16px;cursor:pointer;padding:4px 2px 4px 6px;flex-shrink:0;opacity:0.55;transition:opacity .15s}
.spk:active{opacity:1;transform:scale(1.15)}
.speak-hint{font-size:11px;color:#a0927c;text-align:center;padding:0 0 10px;line-height:1.6}
.weekend-msg{text-align:center;padding:40px 20px;color:#a0927c;font-size:14px;line-height:2}
.no-day{text-align:center;padding:40px 20px;color:#a0927c;font-size:14px;line-height:2}
.card{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:14px;border:1px solid rgba(0,0,0,0.07)}
.summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.scard{background:#fff;border-radius:14px;padding:12px 8px;text-align:center;border:1px solid rgba(0,0,0,0.07)}
.sval{font-size:26px;font-weight:900;line-height:1}
.slabel{font-size:11px;color:#a0927c;margin-top:4px}
.clabel{font-size:12px;color:#a0927c;font-weight:700;margin-bottom:12px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.bar-date{font-size:11px;color:#a0927c;width:48px;text-align:right;flex-shrink:0}
.bar-track{flex:1;background:rgba(0,0,0,0.07);border-radius:20px;height:19px;overflow:hidden}
.bar-fill{height:100%;border-radius:20px;display:flex;align-items:center;padding-left:8px;transition:width .4s}
.bar-pct{font-size:11px;font-weight:700;color:#fff;white-space:nowrap}
.bar-cnt{font-size:11px;color:#d94f4f;width:26px;text-align:right;flex-shrink:0}
.inp-row{display:flex;gap:8px;margin-bottom:8px}
input{background:#f7f2ea;border:1px solid rgba(0,0,0,0.08);border-radius:8px;color:#2c2418;font-family:inherit;font-size:13px;padding:8px 10px;outline:none;width:100%}
.inp-num{width:50px!important;text-align:center}
.btn{width:100%;padding:11px;border-radius:10px;border:none;color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin-top:2px}
.btn1{background:#c47a2a}.btn2{background:#2a7a9e}
.msg{font-size:12px;text-align:center;margin-top:8px;min-height:16px}
.wrong-item{background:#f7f2ea;border-radius:10px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.wi-word{font-size:15px;font-weight:800}
.wi-mean{font-size:12px;color:#a0927c}
.wi-dates{font-size:10px;color:#bba898;margin-top:2px}
.badge{background:#d94f4f;color:#fff;border-radius:20px;font-size:11px;font-weight:700;padding:3px 10px;flex-shrink:0}
.empty{color:#a0927c;font-size:13px;text-align:center;padding:16px 0}
.loading{text-align:center;color:#a0927c;font-size:14px;padding:40px 0}
.note-section{display:none}.note-section.active{display:block}
.wrong-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.wrong-cnt{font-size:13px;color:#d94f4f}
.note-header{text-align:center;padding:12px 0 16px}
.note-header h2{font-size:18px;font-weight:900}
.note-header p{font-size:12px;color:#a0927c;margin-top:3px}
/* 수학 */
.math-header{text-align:center;padding:12px 0 16px}
.math-header h2{font-size:18px;font-weight:900}
.math-header p{font-size:12px;color:#a0927c;margin-top:3px}
.math-card{background:#fff;border-radius:14px;padding:18px 16px;margin-bottom:14px;border:1px solid rgba(0,0,0,.07)}
.math-card.center{text-align:center}
.math-q{font-size:30px;font-weight:800;text-align:center;padding:24px 0 20px;line-height:1.4;color:#2c2418}
.math-input{background:#f7f2ea;border:2px solid rgba(0,0,0,.1);border-radius:10px;font-size:20px;text-align:center;padding:12px;width:100%;font-weight:700;margin-bottom:10px}
.math-input:focus{border-color:#2a7a9e;outline:none}
.math-input:disabled{opacity:.7}
.math-fb{text-align:center;font-size:14px;font-weight:700;min-height:24px;margin-bottom:10px}
.math-fb.ok{color:#4caf6e}.math-fb.no{color:#d94f4f}
.math-btn{width:100%;padding:13px;border-radius:10px;border:none;background:#2a7a9e;color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:8px}
.math-btn.ghost{background:transparent;color:#8a7a68;border:1px solid rgba(0,0,0,.12)}
.math-btn:active{opacity:.85}
.math-hint{text-align:center;font-size:11px;color:#a0927c;line-height:1.7;margin-top:4px}
.math-progress{background:rgba(0,0,0,.07);border-radius:20px;height:6px;overflow:hidden;margin-bottom:14px}
.math-bar{height:100%;background:#2a7a9e;border-radius:20px;transition:width .3s}
.math-result{background:#fff;border-radius:14px;padding:28px 16px;text-align:center;margin-bottom:14px;border:1px solid rgba(0,0,0,.07)}
.math-score{font-size:46px;font-weight:900;color:#2a7a9e;line-height:1}
.math-score span{font-size:22px;color:#a0927c}
.math-rate{font-size:14px;color:#8a7a68;margin-top:6px}
.math-levelup{background:#e8f5e9;border:1px solid #a5d6a7;border-radius:12px;padding:14px;text-align:center;font-size:14px;color:#2e7d32;line-height:1.7;margin-bottom:14px}
.math-leveldown{background:#fff3e0;border:1px solid #ffcc80;border-radius:12px;padding:14px;text-align:center;font-size:14px;color:#e65100;line-height:1.7;margin-bottom:14px}
.math-lv-badge{display:inline-block;background:#2a7a9e;color:#fff;font-size:13px;font-weight:800;padding:5px 14px;border-radius:20px;margin-bottom:10px}
.math-lv-name{font-size:18px;font-weight:800;margin-bottom:4px}
.math-lv-desc{font-size:12px;color:#a0927c;margin-bottom:18px}
.math-lv-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:13px}
.math-lv-row.on{background:#e3f4fb;font-weight:700}
.math-lv-row.done{opacity:.5}
.mlr-num{font-size:11px;font-weight:700;color:#2a7a9e;width:34px;flex-shrink:0}
.math-wrong{background:#f7f2ea;border-radius:8px;padding:10px 12px;margin-bottom:6px}
.mw-q{font-size:15px;font-weight:700;margin-bottom:4px}
.mw-a{font-size:12px;color:#8a7a68}
.mw-a .ok{color:#4caf6e;font-weight:700}
.mw-a .no{color:#d94f4f;font-weight:700}
.math-hist{display:flex;align-items:center;justify-content:space-between;padding:8px 4px;border-bottom:1px solid rgba(0,0,0,.05);font-size:12px}
.math-hist:last-child{border-bottom:none}
.mh-date{color:#a0927c;width:44px}
.mh-lv{color:#8a7a68;font-size:11px}
.mh-score{font-weight:700}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;line-height:1.15}
.fr-n{border-bottom:2px solid #2c2418;padding:0 5px}
.fr-d{padding:0 5px}
.mx{display:inline-flex;align-items:center;gap:3px}
.mx-w{font-size:1em}
</style>
</head>
<body>
<div class="main-tabs">
  <button class="main-tab on" onclick="switchMain('word')">📖 단어</button>
  <button class="main-tab" onclick="switchMain('note')">📝 오답</button>
  <button class="main-tab" onclick="switchMain('math')">🔢 수학</button>
</div>
<div id="page-word" class="page active">
  <div class="word-header">
    <h2 id="word-day-title">오늘의 단어</h2>
    <p id="word-day-sub"></p>
  </div>
  <div class="kid-tabs">
    <button class="kid-tab on1" onclick="switchKidWord(1)">하준 (20개)</button>
    <button class="kid-tab" onclick="switchKidWord(2)">하민 (10개)</button>
  </div>
  <p class="speak-hint">🔊 를 누르면 발음이 들려요 · 단어를 누르면 사전이 열려요</p>
  <div id="word-content"></div>
</div>
<div id="page-note" class="page">
  <div class="note-header"><h2>오답노트</h2><p>어디서 열어도 같은 데이터가 보여요</p></div>
  <div class="kid-tabs">
    <button class="kid-tab on1" onclick="switchKidNote(1)">하준 (20개)</button>
    <button class="kid-tab" onclick="switchKidNote(2)">하민 (10개)</button>
  </div>
  <div id="note-sec1" class="note-section active"></div>
  <div id="note-sec2" class="note-section"></div>
</div>
<div id="page-math" class="page"></div>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
<script src="data.js"></script>
<script src="math.js"></script>
<script src="app.js"></script>
</body>
</html>
