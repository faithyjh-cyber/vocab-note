let currentTab = 1;

// ── API (JSONP로 CORS 우회) ─────────────────────
function apiLoad(kid) {
  return new Promise((resolve) => {
    const cbName = 'cb_' + Date.now();
    const script = document.createElement('script');
    window[cbName] = (data) => {
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      resolve((data && data.records) ? data : { records: [], wrongs: {} });
    };
    script.onerror = () => resolve({ records: [], wrongs: {} });
    script.src = API + '?kid=kid' + kid + '&callback=' + cbName;
    document.body.appendChild(script);
    setTimeout(() => resolve({ records: [], wrongs: {} }), 10000);
  });
}

async function apiSave(kid, data) {
  try {
    await fetch(API, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ kid: 'kid' + kid, data }),
    });
  } catch {}
}

// ── 초기 로드 ───────────────────────────────────
async function init() {
  renderLoading(1); renderLoading(2);
  const [d1, d2] = await Promise.all([apiLoad(1), apiLoad(2)]);

  // 첫 실행 시 어제 오답 기본값
  if (!d1.records.length) {
    d1.records.push({ date:'8/24(금)', total:20, wrong:['find'] });
    d1.wrongs['find'] = { count:1, dates:['8/24(금)'] };
    await apiSave(1, d1);
  }
  if (!d2.records.length) {
    d2.records.push({ date:'8/24(금)', total:10, wrong:['sofa','mirror'] });
    d2.wrongs['sofa'] = { count:1, dates:['8/24(금)'] };
    d2.wrongs['mirror'] = { count:1, dates:['8/24(금)'] };
    await apiSave(2, d2);
  }

  dataMap[1] = d1; dataMap[2] = d2;
  render(1); render(2);
}

// ── 탭 전환 ────────────────────────────────────
function switchTab(n) {
  currentTab = n;
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.className = 'tab' + (i + 1 === n ? ` on${n}` : '');
  });
  document.querySelectorAll('.section').forEach((s, i) => {
    s.classList.toggle('active', i + 1 === n);
  });
}

// ── 오답 추가 ──────────────────────────────────
async function addRecord(kid) {
  const date = document.getElementById(`d${kid}-date`).value.trim();
  const total = parseInt(document.getElementById(`d${kid}-total`).value) || KIDS[kid].total;
  const wordsRaw = document.getElementById(`d${kid}-words`).value.trim();
  const msgEl = document.getElementById(`d${kid}-msg`);

  if (!date) { msgEl.style.color='#d94f4f'; msgEl.textContent='날짜를 입력해 주세요'; return; }

  msgEl.style.color='#a0927c'; msgEl.textContent='저장 중...';
  document.getElementById(`d${kid}-btn`).disabled = true;

  const wrong = wordsRaw ? wordsRaw.split(',').map(w => w.trim().toLowerCase()).filter(Boolean) : [];
  const data = JSON.parse(JSON.stringify(dataMap[kid]));

  const idx = data.records.findIndex(r => r.date === date);
  if (idx >= 0) {
    data.records[idx].wrong.forEach(w => {
      if (data.wrongs[w]) {
        data.wrongs[w].count--;
        data.wrongs[w].dates = data.wrongs[w].dates.filter(d => d !== date);
        if (data.wrongs[w].count <= 0) delete data.wrongs[w];
      }
    });
    data.records[idx] = { date, total, wrong };
  } else {
    data.records.push({ date, total, wrong });
  }

  wrong.forEach(w => {
    if (!data.wrongs[w]) data.wrongs[w] = { count:0, dates:[] };
    data.wrongs[w].count++;
    if (!data.wrongs[w].dates.includes(date)) data.wrongs[w].dates.push(date);
  });

  await apiSave(kid, data);
  dataMap[kid] = data;
  render(kid);

  document.getElementById(`d${kid}-date`).value = '';
  document.getElementById(`d${kid}-words`).value = '';
  msgEl.style.color='#4caf6e'; msgEl.textContent='저장됐어요 ✓';
  setTimeout(() => { msgEl.textContent=''; }, 2500);
  document.getElementById(`d${kid}-btn`).disabled = false;
}

// ── 렌더링 ─────────────────────────────────────
function renderLoading(kid) {
  document.getElementById(`sec${kid}`).innerHTML = `<div class="loading">불러오는 중...</div>`;
}

function render(kid) {
  const data = dataMap[kid];
  if (!data) return;
  const { color } = KIDS[kid];
  const records = data.records || [];
  const wrongs = data.wrongs || {};

  const totalW = records.reduce((s,r) => s + r.wrong.length, 0);
  const days = records.length;
  const avg = days > 0
    ? Math.round(records.reduce((s,r) => s + ((r.total - r.wrong.length) / r.total * 100), 0) / days)
    : null;

  const wrongEntries = Object.entries(wrongs).sort((a,b) => b[1].count - a[1].count);

  // 그래프
  const chartHTML = records.length === 0
    ? `<p class="empty">아직 기록이 없어요</p>`
    : records.slice(-8).map(r => {
        const pct = Math.round(((r.total - r.wrong.length) / r.total) * 100);
        const bc = pct >= 90 ? '#4caf6e' : pct >= 70 ? color : '#d94f4f';
        return `<div class="bar-row">
          <span class="bar-date">${r.date}</span>
          <div class="bar-track">
            <div class="bar-fill" style="width:${pct}%;background:${bc}">
              <span class="bar-pct">${pct}%</span>
            </div>
          </div>
          <span class="bar-cnt">${r.wrong.length > 0 ? '-'+r.wrong.length : '✓'}</span>
        </div>`;
      }).join('');

  // 오답 목록
  const wrongHTML = wrongEntries.length === 0
    ? `<p class="empty">오답이 없어요 🎉</p>`
    : wrongEntries.map(([w, info]) => {
        const meaning = DICT[w.toLowerCase()] || '';
        return `<div class="wrong-item">
          <div>
            <div class="wi-word" style="color:${color}">${w}</div>
            <div class="wi-mean">${meaning}</div>
            <div class="wi-dates">${info.dates.join(', ')}</div>
          </div>
          <div class="badge">${info.count}회</div>
        </div>`;
      }).join('');

  document.getElementById(`sec${kid}`).innerHTML = `
    <div class="summary">
      <div class="scard"><div class="sval" style="color:#d94f4f">${totalW}</div><div class="slabel">누적 오답</div></div>
      <div class="scard"><div class="sval" style="color:#4caf6e">${avg !== null ? avg+'%' : '-'}</div><div class="slabel">평균 정답률</div></div>
      <div class="scard"><div class="sval" style="color:${color}">${days}</div><div class="slabel">진행 일수</div></div>
    </div>

    <div class="card">
      <div class="clabel">일별 정답률</div>
      ${chartHTML}
    </div>

    <div class="card">
      <div class="clabel">오답 입력</div>
      <div class="inp-row">
        <input id="d${kid}-date" class="inp-date" placeholder="8/25(월)">
        <input id="d${kid}-total" class="inp-num" type="number" value="${KIDS[kid].total}">
      </div>
      <input id="d${kid}-words" placeholder="틀린 단어 (쉼표 구분, 없으면 비워두세요)" style="margin-bottom:10px">
      <button id="d${kid}-btn" class="btn ${KIDS[kid].cls}" onclick="addRecord(${kid})">기록 추가</button>
      <div id="d${kid}-msg" class="msg"></div>
    </div>

    <div class="card">
      <div class="wrong-header">
        <span class="clabel" style="margin:0">오답 모음</span>
        ${wrongEntries.length > 0 ? `<span class="wrong-cnt">${wrongEntries.length}개</span>` : ''}
      </div>
      ${wrongHTML}
    </div>
  `;
}

init();
</script>
</body>
</html>
